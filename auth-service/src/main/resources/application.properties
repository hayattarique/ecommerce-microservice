spring.application.name=AUTH-SERVICE
server.port=9091
spring.profiles.active=dev

# =============================
# Eureka Configuration
# =============================
eureka.client.service-url.default=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =============================
# Actuator
# =============================
# Only health is exposed -- the Jenkins pipeline polls /actuator/health after
# deploying and fails the build if the service never reports UP.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always


management.tracing.sampling.probability=1.0
management.opentelemetry.resource-attributes.service.name=AUTH-SERVICE
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces


# Jaeger ingests OTLP traces only; stop micrometer-registry-otlp (pulled in by
# spring-boot-starter-opentelemetry) from pushing metrics at /v1/metrics.
management.otlp.metrics.export.enabled=false
