spring.application.name=AUTH-SERVICE
server.port=9091
spring.profiles.active=dev

# =============================
# Eureka Configuration
# =============================
eureka.client.service-url.default=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost

# =============================
# Actuator
# =============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.export.enabled=true
management.tracing.sampling.probability=1.0

management.otlp.metrics.export.enabled=false

# ==========================================================================
# Outbound HTTP (RestClient)
# ==========================================================================
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s
spring.http.clients.redirects=dont-follow
spring.http.serviceclient.user-service.base-url=lb://USER-SERVICE

# Honour X-Forwarded-* from the gateway (Swagger "servers" URL points at the gateway)
server.forward-headers-strategy=framework
