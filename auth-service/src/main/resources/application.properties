spring.application.name=AUTH-SERVICE
server.port=9091
spring.profiles.active=dev

# =============================
# Eureka Configuration
# =============================
eureka.client.service-url.default=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost

# =============================
# Actuator
# =============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.export.enabled=true
management.tracing.sampling.probability=1.0

management.otlp.metrics.export.enabled=false

# ==========================================================================
# Outbound HTTP (RestClient)
# ==========================================================================
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s
spring.http.clients.redirects=dont-follow
spring.http.serviceclient.user-service.base-url=lb://USER-SERVICE

# ==========================================================================
# Refresh-token cookie (HttpOnly). Lifetime = jwt.refresh-expiration.
# path is the GATEWAY path the browser sees. same-site: Strict when frontend and
# gateway share a site, None when they do not (then the gateway Origin check is a must).
# ==========================================================================
auth.refresh-cookie.name=__Secure-refresh
auth.refresh-cookie.path=/auth-service/api/v1/auth
auth.refresh-cookie.secure=true
auth.refresh-cookie.same-site=Strict

# ==========================================================================
# Fingerprint cookie (HttpOnly). Binds the access token to this browser: the token's "fgp" claim
# holds the SHA-256 of this cookie's value, and the gateway checks they match on every call.
# Path is always "/". The name MUST equal gateway.token-fingerprint.cookie-name in the gateway.
# ==========================================================================
auth.fingerprint-cookie.name=__Secure-fgp
auth.fingerprint-cookie.secure=true
auth.fingerprint-cookie.same-site=Strict

# Honour X-Forwarded-* from the gateway (Swagger "servers" URL points at the gateway)
server.forward-headers-strategy=framework
