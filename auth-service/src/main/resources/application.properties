spring.application.name=AUTH-SERVICE
server.port=9091
spring.profiles.active=dev

# =============================
# Eureka Configuration
# =============================
eureka.client.service-url.default=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost

# =============================
# Actuator
# =============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.export.enabled=true
management.tracing.sampling.probability=1.0

management.otlp.metrics.export.enabled=false

# ==========================================================================
# Outbound HTTP (RestClient)
# ==========================================================================
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s
spring.http.clients.redirects=dont-follow
spring.http.serviceclient.user-service.base-url=lb://USER-SERVICE



rest.client.config.max-connection=200

# Per host limit. THE MOST IMPORTANT ONE - Apache defaults to only 5.
rest.client.config.max-connection-per-route=50

# How long to wait for a free connection when the pool is full. Fail fast, do not queue.
rest.client.config.connection-request-timeout=2

# Maximum lifetime of a pooled connection (300s = 5 min). Without it, traffic keeps
# hitting instances that have already been decommissioned.
rest.client.config.connection-time-to-live=300

# Re-validate a connection idle this long before reusing it. This is what prevents
# "connection reset by peer" errors.
rest.client.config.validate-after-inactive=10

# Background sweeper closes connections unused for longer than this.
rest.client.config.idle-eviction-threshold=30
