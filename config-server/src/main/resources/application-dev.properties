# ===================================================
# spring cloud config server configuration
# ===================================================
spring.cloud.config.server.git.clone-on-start=true
# make sure it is pooling from dev branch
spring.cloud.config.server.git.default-label=dev
spring.cloud.config.server.git.uri=https://github.com/hayattarique/ecommerce-config-repo.git
spring.cloud.config.server.git.username=${GIT_USER}
spring.cloud.config.server.git.password=${GIT_PASSWORD}