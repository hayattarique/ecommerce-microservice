# ==========================================
# Application Properties
# ==========================================
spring.application.name=ECOMMERCE-GATEWAY
server.port=9999
spring.profiles.active=dev

# ==========================================
# Eureka Client Configuration
# ==========================================
eureka.client.service-url.default=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.client.registryFetchIntervalSeconds=5
eureka.instance.leaseRenewalIntervalInSeconds=10
eureka.instance.leaseExpirationDurationInSeconds=30

# ==========================================
# Actuator
# ==========================================
# Only health is exposed -- the Jenkins pipeline polls /actuator/health after
# deploying and fails the build if the service never reports UP.
# /actuator/** is served by the gateway itself: no route predicate matches it,
# so JwtAuthenticationFilter (a GlobalFilter) never sees these requests.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always


management.tracing.sampling.probability=1.0
management.opentelemetry.resource-attributes.service.name=ECOMMERCE-GATEWAY
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces



# Jaeger ingests OTLP traces only; stop micrometer-registry-otlp (pulled in by
# spring-boot-starter-opentelemetry) from pushing metrics at /v1/metrics.
management.otlp.metrics.export.enabled=false

# Log4j2 (replaces Logback) keeps Boot's console layout; this line puts the
# OTel trace/span IDs into every log line so logs join up with Jaeger traces.
logging.pattern.correlation=[${spring.application.name:-},%X{traceId:-},%X{spanId:-}] 

# Spring Cloud Gateway 5.0.2 declares @Valid on List fields (GatewayProperties.routes,
# RouteDefinition.predicates/filters), which Hibernate Validator 9 deprecates (HV000271).
# Upstream issue, harmless -- validation still runs. Silenced to keep startup clean.
logging.level.org.hibernate.validator.internal.metadata.aggregated.CascadingMetaDataBuilder=ERROR
