# ==========================================
# Application Properties
# ==========================================
spring.application.name=ECOMMERCE-GATEWAY
server.port=9999
spring.profiles.active=dev

# ==========================================
# Eureka Client Configuration
# ==========================================
eureka.client.service-url.default=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.client.registryFetchIntervalSeconds=5
eureka.instance.leaseRenewalIntervalInSeconds=10
eureka.instance.leaseExpirationDurationInSeconds=30

# ==========================================
# Actuator
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.export.enabled=true
management.tracing.sampling.probability=1.0

management.otlp.metrics.export.enabled=false

# ==========================================
# Swagger UI (one UI for all services, served by the gateway)
# ==========================================
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/auth-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=user-service
springdoc.swagger-ui.urls[1].url=/user-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=product-service
springdoc.swagger-ui.urls[2].url=/product-service/v3/api-docs



spring.reactor.context-propagation=auto

# ==========================================
# CORS (which browser origins may call the gateway)
# ==========================================
# Exact origins - never "*": the refresh cookie needs allow-credentials=true.
# To change them in a profile (dev, prod...), define allowed-origins[0], [1]... there:
# Spring takes the whole list from that profile and drops these localhost entries.
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins[0]=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins[1]=http://localhost:5173

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[3]=PATCH
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[4]=DELETE
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[5]=OPTIONS

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[0]=Authorization
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[1]=Content-Type

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers[0]=X-Trace-Id

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600
