# ==========================================
# Application Properties
# ==========================================
spring.application.name=ECOMMERCE-GATEWAY
server.port=9999
spring.profiles.active=dev

# ==========================================
# Eureka Client Configuration
# ==========================================
eureka.client.service-url.default=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.client.registryFetchIntervalSeconds=5
eureka.instance.leaseRenewalIntervalInSeconds=10
eureka.instance.leaseExpirationDurationInSeconds=30

# ==========================================
# Actuator
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.export.enabled=true
management.tracing.sampling.probability=1.0

management.otlp.metrics.export.enabled=false

# ==========================================
# Browser origins (CORS, also the CSRF guard for the refresh cookie)
# ==========================================
# The ONLY place CORS is configured. Exact origins - never "*", because the refresh
# cookie needs allow-credentials=true, which browsers refuse to combine with "*".
# The gateway also REJECTS (403) any request whose Origin is not listed here, so a foreign
# site cannot make the browser call refresh-token or logout with the user's cookie.
# Same-origin requests (e.g. Swagger UI on the gateway) are not affected.
# Override gateway.allowed-origins in each environment's profile with the real frontend URL.
gateway.allowed-origins=http://localhost:3000,http://localhost:5173

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${gateway.allowed-origins}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
# Lets frontend JavaScript read the trace id (TraceIdResponseFilter), e.g. to show it in error messages
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=X-Trace-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

# ==========================================
# Access token fingerprint (token sidejacking defence)
# ==========================================
# Every protected call must carry the HttpOnly fingerprint cookie whose SHA-256 equals the access
# token's "fgp" claim, so a copied token is useless without the browser's cookie.
# cookie-name MUST equal auth.fingerprint-cookie.name in auth-service.
gateway.token-fingerprint.enabled=true
gateway.token-fingerprint.cookie-name=__Secure-fgp

# ==========================================
# Swagger UI (one UI for all services, served by the gateway)
# ==========================================
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/auth-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=user-service
springdoc.swagger-ui.urls[1].url=/user-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=product-service
springdoc.swagger-ui.urls[2].url=/product-service/v3/api-docs



spring.reactor.context-propagation=auto
