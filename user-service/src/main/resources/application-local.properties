# =============================
# Database Configuration
# =============================
spring.datasource.url=jdbc:postgresql://localhost:5432/user_service
spring.datasource.username=postgres
spring.datasource.password=root

# =============================
# Hibernate Configuration
# =============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true


# =============================
# FETCHES FROM CONFIG SERVER
# =============================
spring.config.import=configserver:http://localhost:8888

# =============================
# Flyway Configuration
# =============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================
# Admin Database Seeder Configuration
# =============================
admin.database.seeder.enabled=false
admin.database.seeder.first-name=Tarique
admin.database.seeder.last-name=Hayat
admin.database.seeder.email=admin@ecommerce.com
admin.database.seeder.gender=MALE
admin.database.seeder.mobile=9876543210
admin.database.seeder.date-of-birth=2003-10-08

